name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these gates again on the tagged commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, dead code, file sizes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the full history of the checked-out commit (main plus the
          # pull request); the file-size gate lists tracked files.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned external linters (.mise.toml)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run check:file-sizes
      - run: npm run audit:signatures

  test:
    name: Unit tests (100% coverage gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  build-and-smoke:
    name: Build and boot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Boot the compiled build and probe /healthz
        run: scripts/smoke-test.sh node dist/main.js
      - name: Boot from source via Node type stripping and probe /healthz
        run: scripts/smoke-test.sh node src/main.ts
      - name: Export an empty audit log through the compiled CLI
        run: scripts/cli-smoke.sh node dist/cli.js
      - name: Export an empty audit log through the CLI from source
        run: scripts/cli-smoke.sh node src/cli.ts

  docker-build:
    name: Container image builds (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64 with the same Dockerfile the release publishes
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: false
          tags: vaultgate:ci

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit-message.mjs --message "$PR_TITLE"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0

  template-validate:
    name: Azure template validation (ARM-TTK)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out ARM-TTK at a pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Azure/arm-ttk
          ref: 0ec9a41a4503e970a0ec8efb0cd08415cc172175 # 20260213
          path: arm-ttk
          persist-credentials: false
      - name: Every JSON file under deploy/azure parses
        run: |
          find deploy/azure -name '*.json' -print0 | while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" > /dev/null
            echo "ok $file"
          done
      - name: ARM-TTK over deploy/azure (main template, linked modules, parameters, UI definition)
        shell: pwsh
        run: |
          Import-Module ./arm-ttk/arm-ttk/arm-ttk.psd1
          # Every ARM-TTK test applies to this template set, so nothing is skipped.
          $results = @(Test-AzTemplate -TemplatePath deploy/azure)
          $results | Format-Table -AutoSize -Property Name, Passed, @{ Name = 'File'; Expression = { $_.File.Name } }
          foreach ($warning in ($results | Where-Object { $_.Warnings } | ForEach-Object { $_.Warnings })) {
            Write-Warning $warning.Message
          }
          $failed = @($results | Where-Object { -not $_.Passed })
          foreach ($failure in $failed) {
            foreach ($problem in $failure.Errors) {
              Write-Host "::error file=deploy/azure/$($failure.File.Name)::$($failure.Name): $($problem.Exception.Message)"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "$($failed.Count) ARM-TTK test(s) failed."
            exit 1
          }
          Write-Host "ARM-TTK: $($results.Count) tests passed."
