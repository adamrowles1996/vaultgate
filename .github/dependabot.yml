version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'
    ignore:
      # @types/node must track the Node major the project runs on (ADR 0001).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      runtime-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      tooling-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    commit-message:
      prefix: 'ci(deps)'
    groups:
      # One PR per week for all action bumps; a single action used in several
      # jobs must move as one change so pins never disagree.
      github-actions:
        patterns: ['*']
