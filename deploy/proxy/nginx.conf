# nginx in front of vaultgate (docs/spec/09-deployment.md, DEP-11 and DEP-12).
#
# Drop into /etc/nginx/conf.d/vaultgate.conf (or sites-available) and replace
# vault.example.com and the certificate paths. Certbot's nginx plugin writes
# an equivalent pair of ssl_certificate lines for you.
server {
  listen 80;
  listen [::]:80;
  server_name vault.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name vault.example.com;

  ssl_certificate /etc/letsencrypt/live/vault.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vault.example.com/privkey.pem;

  # DEP-11: forward Host unchanged and declare the public scheme. nginx passes
  # the Authorization request header and the WWW-Authenticate response header
  # through by default; do not add proxy_hide_header for either.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  # OPS-6: overwrite X-Forwarded-For with the accepted connection's address;
  # $proxy_add_x_forwarded_for would append to whatever the client sent.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Connection "";

  # DEP-12: streamed responses need no buffering and a generous read timeout.
  proxy_read_timeout 300s;
  proxy_send_timeout 60s;

  location /mcp {
    proxy_pass http://127.0.0.1:8080;
    proxy_buffering off;
    proxy_cache off;
    # Streamable HTTP keeps a response open while a tool call runs; the
    # server-level proxy_read_timeout (300s) is the ceiling. If you shorten it
    # elsewhere, set a longer one here for /mcp alone, or agents see the
    # stream cut mid-call.
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
  }
}
