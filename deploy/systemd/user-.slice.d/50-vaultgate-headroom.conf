# Installed by install.sh --cap-login-sessions (DEP-13). One memory budget per login user,
# shared by all of that user's sessions, sudo children included: a runaway command run over SSH
# is throttled and, past MemoryMax, OOM-killed inside its own slice instead of pushing the host
# into a global OOM that can take vaultgate and its code sidecar with it. vaultgate, the sidecar,
# cron and timers run in system.slice and are not capped; run long administrative jobs there
# with systemd-run. Every installer run replaces this file; to change a value, override it in a
# later drop-in beside it (for example 60-local.conf).
[Slice]
MemoryHigh=768M
MemoryMax=1G
CPUWeight=25
