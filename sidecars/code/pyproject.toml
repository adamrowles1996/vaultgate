[project]
name = "vaultgate-code"
version = "0.1.0"
description = "The sidecar of vaultgate's code connector: extracts repository archives and serves semble searches."
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.12.*"
# semble is the runtime dependency; pathspec (include and exclude) comes with it. semble-grammars
# (its tree-sitter grammars, which semble requires) is pinned too: vaultgate_code.grammars reads
# its manifest to extract and verify the grammars directory.
dependencies = ["semble==0.6.1", "semble-grammars==0.1.2"]

[dependency-groups]
dev = ["mypy==2.3.1", "pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.9"]

[tool.uv]
# Not built or installed as a package: nothing needs an unlocked build backend. The code runs
# from src/ (PYTHONPATH in the image, `pythonpath` for pytest).
package = false

[tool.pytest.ini_options]
# tests/ holds `childtargets`, the build-child stand-ins a spawned child must import by name.
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "--cov=vaultgate_code",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=100",
]
filterwarnings = [
  "error",
  # model2vec 0.9.0 opens the model's config.json without closing it.
  "ignore:Exception ignored in. <_io.FileIO name='[^']*config.json':pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["vaultgate_code"]
# The build child and the command-line tests run in other interpreters; coverage follows them.
concurrency = ["thread", "multiprocessing"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A", "ARG", "B", "BLE", "C4", "C90", "D", "DTZ", "E", "EM", "ERA", "F", "FBT", "I", "ISC",
  "N", "PERF", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF", "S", "SIM", "SLF", "T20", "TID",
  "TRY", "UP", "W",
]
# PTH: the os-level calls (dir_fd, O_NOFOLLOW, lstat) are deliberate.
ignore = ["D203", "D213", "D401", "TRY003", "EM101", "EM102", "COM812", "PTH"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "PLR2004", "SLF001", "D100", "D103", "D104", "FBT"]

[tool.mypy]
strict = true
# The tests import their helpers (`archives`, `repo`...) as top-level modules, as pytest does.
mypy_path = ["src", "tests"]
files = ["src", "tests"]
explicit_package_bases = true
warn_unreachable = true

[[tool.mypy.overrides]]
# semble-grammars ships no py.typed marker; its functions are annotated, so mypy reads them.
module = ["semble_grammars", "semble_grammars.*"]
follow_untyped_imports = true
